<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>xload@localhost</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      image-rendering: pixelated;
    }
    body {
      width: 400px;
      height: 330px;
      background-color: #c0c0c0;
      padding: 4px;
      overflow: hidden;
      border: 2px solid #ffffff;
      border-right-color: #808080;
      border-bottom-color: #808080;
      box-shadow: inset 1px 1px 0px #dfdfdf, 1px 1px 3px rgba(0,0,0,0.4);
    }
    .crt-screen {
      position: relative;
      width: 100%; height: 180px;
      background-color: #000000;
      overflow: hidden;
      border: 3px inset #808080;
      margin-bottom: 6px;
    }
    .scanlines {
      pointer-events: none;
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
    }
    .crt-flicker {
      pointer-events: none;
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      animation: flicker 0.15s infinite;
      background: rgba(18,16,16,0.015);
      z-index: 11;
    }
    @keyframes flicker {
      0% { opacity: 0.97; }
      50% { opacity: 1.0; }
      100% { opacity: 0.98; }
    }
    canvas {
      display: block;
      width: 100%; height: 100%;
    }
    .x11-title-bar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 6px;
      font-size: 11px;
      border-bottom: 2px solid #808080;
      margin-bottom: 4px;
    }
    .panel-settings {
      background-color: #c0c0c0;
      border: 2px inset #ffffff;
      padding: 6px;
      font-size: 11px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    label {
      text-transform: uppercase;
      font-size: 9px;
      color: #404040;
    }
    select, input {
      font-size: 11px;
      padding: 2px;
      background-color: #ffffff;
      border: 2px inset #808080;
      outline: none;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 4px;
      grid-column: span 2;
    }
    .status-bar {
      margin-top: 4px;
      font-size: 9px;
      color: #555;
      text-transform: uppercase;
      background-color: #dfdfdf;
      padding: 2px 4px;
      border: 1px inset #ffffff;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="x11-title-bar">
    <div>xload - System Load Average</div>
  </div>
  <div class="crt-screen">
    <div class="scanlines"></div>
    <div class="crt-flicker"></div>
    <canvas id="xload-canvas" width="390" height="174"></canvas>
  </div>
  <div class="panel-settings">
    <div class="form-group">
      <label>Theme Accent</label>
      <select id="theme-select">
        <option value="classic">Classic X11 (White)</option>
        <option value="retro-dark">Phosphor Slate (Dark)</option>
        <option value="amber-crt">Amber Monitor</option>
        <option value="matrix-green">Hacker Green</option>
        <option value="vapor-cyber">Neon Cyberpunk</option>
        <option value="mono-high">Monochrome</option>
      </select>
    </div>
    <div class="form-group">
      <label>Refresh Rate</label>
      <select id="interval-select">
        <option value="100">0.1s (Ultrafast)</option>
        <option value="500">0.5s (Fast)</option>
        <option value="1000">1.0s (Normal)</option>
        <option value="2000">2.0s (Relaxed)</option>
        <option value="5000">5.0s (Slow)</option>
      </select>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="grid-toggle" checked>
      <label for="grid-toggle">Draw Grid Alignments</label>
      <input type="checkbox" id="scanlines-toggle" checked style="margin-left: 10px;">
      <label for="scanlines-toggle">CRT Scanlines</label>
    </div>
  </div>
  <div class="status-bar">
    <span id="load-value">LOAD: 0.00%</span>
    <span id="scale-value">SCALE: 10% max</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
